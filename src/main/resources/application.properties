spring.application.name=equity-report-utility
server.port=8080

# --- Equity Trading App database (PostgreSQL) ---
# Override with env vars DB_URL / DB_USERNAME / DB_PASSWORD, or with a git-ignored
# config/application.properties in the project folder (see README).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# validate = check entities match the tables on startup; never creates or alters the schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.sql.init.mode=never

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
